name: "9C.7-B2 Generate canonical migration name (one-time)"
on:
  push:
    branches: ["feature/9c7-b2-client-daily-trends-rpc"]
    paths: [".github/workflows/9c7-b2-migration-name.yml"]
permissions:
  contents: read
jobs:
  migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: "2.79.0"
      - name: Generate fresh versioned migration filename (no database connection)
        run: |
          supabase --version
          supabase migration --help
          supabase migration new fm_delegated_daily_trends
          echo "9C7_B2_GENERATED_MIGRATION_START"
          find supabase/migrations -maxdepth 1 -name "*_fm_delegated_daily_trends.sql" -print
          echo "9C7_B2_GENERATED_MIGRATION_END"
