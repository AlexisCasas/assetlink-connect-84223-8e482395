name: "ROMAX R2-E1.5 technical catalog UI QA"

on:
  pull_request:
    branches: ["feature/romax-r2e1-2-unit-normalization"]
    paths:
      - "src/components/provider/CostCatalogView.tsx"
      - "src/components/provider/RomaxMaterialCatalogPanel.tsx"
      - ".github/workflows/romax-r2e1-5-ui-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: romax-r2e1-5-ui-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: "R2-E1.5 TypeScript, ESLint and Vite build"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript - no new diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.app.json > /tmp/romax-r2e1-5-tsc.log 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then echo "R2E1_5_TYPESCRIPT=PASS"; exit 0; fi
          cat /tmp/romax-r2e1-5-tsc.log
          test "$(git hash-object src/pages/Index.tsx)" = "c1cac2b37bfb357c16d5f821cd9cbda067c5429b" ||
            { echo "NO_GO: modified inherited TypeScript baseline"; exit 1; }
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const diagnostics = readFileSync('/tmp/romax-r2e1-5-tsc.log','utf8').split('\n').filter(x=>/error TS\d+:/.test(x));
          const expected = [
            /^src\/pages\/Index\.tsx\(42,24\): error TS2322:/,
            /^src\/pages\/Index\.tsx\(43,26\): error TS2322:/,
            /^src\/pages\/Index\.tsx\(59,26\): error TS2322:/,
          ];
          assert.equal(diagnostics.length, expected.length, 'Unexpected TypeScript diagnostics');
          for (let i=0;i<expected.length;i++) assert.match(diagnostics[i],expected[i]);
          console.log("R2E1_5_TYPESCRIPT=PASS (only unchanged inherited Index.tsx diagnostics)");
          JS
      - name: Lint catalog UI
        run: npx eslint src/components/provider/CostCatalogView.tsx src/components/provider/RomaxMaterialCatalogPanel.tsx
      - name: Production build
        run: npm run build
