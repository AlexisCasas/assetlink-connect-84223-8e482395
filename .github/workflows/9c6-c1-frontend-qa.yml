name: One Facility 9C.6-C1 frontend QA

on:
  push:
    branches: ["feature/9c6-c1-fm-work-order-ui"]
  pull_request:
    branches: ["productization/mvp"]
    paths:
      - "src/**"
      - ".github/workflows/9c6-c1-frontend-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fm-c1-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint-build:
    name: "TypeScript, scoped lint and Vite build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check app
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint new/changed C1 modules
        run: |
          npx eslint \
            src/lib/delegatedWorkOrders.ts \
            src/components/facility-management/DelegatedWorkOrdersView.tsx \
            src/components/facility-management/DelegatedModules.tsx \
            src/components/facility-management/ManagedClientGate.tsx \
            src/components/facility-management/FacilityManagerPortfolioView.tsx \
            src/components/layout/Sidebar.tsx \
            src/pages/Dashboard.tsx \
            src/lib/facilityManagement.ts \
            src/types/facilityManagement.ts \
            src/lib/entityNavigation.ts
      - name: Confirm delegated transport is RPC-only and read-only
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = (p) => readFileSync(p, 'utf8');
          const transport = read('src/lib/delegatedWorkOrders.ts');
          const ui = read('src/components/facility-management/DelegatedWorkOrdersView.tsx');
          const dashboard = read('src/pages/Dashboard.tsx');
          const nav = read('src/lib/entityNavigation.ts');
          const portfolio = read('src/components/facility-management/FacilityManagerPortfolioView.tsx');
          assert.match(transport, /get_facility_management_work_orders/);
          assert.match(transport, /get_facility_management_work_order/);
          assert.doesNotMatch(transport + ui, /\.from\s*\(/);
          assert.doesNotMatch(transport + ui, /useWorkOrders|WorkOrderDetailDialog|update_work_order_operations|generate_operational_due_notifications/);
          assert.match(dashboard, /case 'managed-work-orders':/);
          assert.match(nav, /'managed-work-orders'/);
          assert.match(portfolio, /Ver órdenes de trabajo/);
          assert.match(ui, /Solo lectura/);
          JS
      - name: Build frontend
        run: npm run build
