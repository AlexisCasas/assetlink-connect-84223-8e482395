name: ROMAX R3-GMAIL.1 OAuth QA
on:
  pull_request:
    branches: ["productization/mvp"]
    paths:
      - "supabase/**"
      - "src/components/provider/GmailConnectionPanel.tsx"
      - "src/components/provider/OpportunitiesView.tsx"
      - "src/pages/GmailCallback.tsx"
      - "src/App.tsx"
      - ".github/workflows/romax-r3-gmail-oauth-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - run: deno check --node-modules-dir=none supabase/functions/romax-gmail-connection/index.ts supabase/functions/romax-gmail-connection-qa/index.ts
      - run: deno test --node-modules-dir=none supabase/functions/romax-gmail-connection/crypto.test.ts supabase/functions/romax-gmail-connection/handler.test.ts supabase/functions/romax-gmail-connection/preview.test.ts
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: "2.79.0"
      - name: Verify isolated context and canonical migration
        run: |
          set -euo pipefail
          test ! -f supabase/.temp/project-ref
          test -f supabase/migrations/20261127205522_romax_r3_gmail_connection.sql
          test -f supabase/tests/romax_r3_gmail_connection.test.sql
          supabase --version
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript no new diagnostics
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.app.json --pretty false > /tmp/romax-gmail-tsc.log 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then exit 0; fi
          cat /tmp/romax-gmail-tsc.log
          test "$(git hash-object src/pages/Index.tsx)" = "c1cac2b37bfb357c16d5f821cd9cbda067c5429b"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const diagnostics=readFileSync('/tmp/romax-gmail-tsc.log','utf8').split('\n').filter(x=>x.includes('error TS'));
          const expected=['src/pages/Index.tsx(42,24): error TS2322:','src/pages/Index.tsx(43,26): error TS2322:','src/pages/Index.tsx(59,26): error TS2322:'];
          assert.equal(diagnostics.length,expected.length);
          expected.forEach((prefix,i)=>assert.ok(diagnostics[i].startsWith(prefix),diagnostics[i]));
          JS
      - run: npx eslint src/components/provider/GmailConnectionPanel.tsx src/pages/GmailCallback.tsx
      - run: npm run build
