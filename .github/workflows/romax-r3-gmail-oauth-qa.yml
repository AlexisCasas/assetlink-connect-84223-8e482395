name: ROMAX R3-GMAIL.1 OAuth QA
on:
  pull_request:
    branches: ["productization/mvp", "feature/romax-r3-gmail-2-1", "feature/romax-r3-gmail-3", "docs/romax-functional-replanning-20261128", "docs/romax-r3-sol-2-design", "docs/romax-r3-gmail-4-design", "feature/romax-r3-gmail-4a", "feature/romax-r3-gmail-4b"]
    paths:
      - "supabase/**"
      - "src/components/provider/GmailConnectionPanel.tsx"
      - "src/components/provider/OpportunitiesView.tsx"
      - "src/components/provider/RequestDetail.tsx"
      - "src/components/provider/RequestEnrichment.tsx"
      - "src/components/provider/romaxEnrichment.ts"
      - "tests/romax-r3-sol-2.test.ts"
      - "src/components/provider/romaxRequestList.ts"
      - "src/components/provider/OpportunityAnalysisView.tsx"
      - "src/pages/Dashboard.tsx"
      - "tests/romax-r3-sol-1.test.ts"
      - "src/components/provider/gmailImportPolicy.ts"
      - "tests/romax-gmail-import-policy.test.ts"
      - "scripts/qa/romax_gmail_import_concurrency.sh"
      - "scripts/qa/romax_sol2_concurrency.sh"
      - "scripts/qa/romax_gmail4a_concurrency.sh"
      - "scripts/qa/romax_gmail4c1_concurrency.sh"
      - "src/pages/GmailCallback.tsx"
      - "src/App.tsx"
      - ".github/workflows/romax-r3-gmail-oauth-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Verify QA and production source parity
        run: |
          cmp supabase/functions/romax-gmail-connection/preview.ts supabase/functions/romax-gmail-connection-qa/preview.ts
          cmp supabase/functions/romax-gmail-connection/handler.ts supabase/functions/romax-gmail-connection-qa/handler.ts
          cmp supabase/functions/romax-gmail-connection/import.ts supabase/functions/romax-gmail-connection-qa/import.ts
          cmp supabase/functions/romax-gmail-connection/crypto.ts supabase/functions/romax-gmail-connection-qa/crypto.ts
          cmp supabase/functions/romax-gmail-connection/attachments.ts supabase/functions/romax-gmail-connection-qa/attachments.ts
          cmp supabase/functions/romax-gmail-connection/quarantine.ts supabase/functions/romax-gmail-connection-qa/quarantine.ts
      - run: deno check --node-modules-dir=none supabase/functions/romax-gmail-connection/index.ts supabase/functions/romax-gmail-connection-qa/index.ts
      - run: deno test --node-modules-dir=none supabase/functions/romax-gmail-connection/crypto.test.ts supabase/functions/romax-gmail-connection/handler.test.ts supabase/functions/romax-gmail-connection/preview.test.ts supabase/functions/romax-gmail-connection/import.test.ts supabase/functions/romax-gmail-connection/attachments.test.ts supabase/functions/romax-gmail-connection/quarantine.test.ts
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: "2.79.0"
      - name: Verify isolated context and canonical migration
        run: |
          set -euo pipefail
          test ! -f supabase/.temp/project-ref
          test -f supabase/migrations/20261127205522_romax_r3_gmail_connection.sql
          test -f supabase/tests/romax_r3_gmail_connection.test.sql
          supabase --version
      - run: supabase start
      - run: supabase test db
      - name: Gmail import concurrent transaction QA (local only)
        run: bash scripts/qa/romax_gmail_import_concurrency.sh
      - name: SOL2 concurrent review QA (local only)
        run: bash scripts/qa/romax_sol2_concurrency.sh
      - name: Gmail attachment metadata concurrent discovery (local only)
        run: bash scripts/qa/romax_gmail4a_concurrency.sh
      - name: Quarantine reservation concurrency (local only)
        run: bash scripts/qa/romax_gmail4c1_concurrency.sh
      - name: Install CLI with security advisors
        uses: supabase/setup-cli@v1
        with:
          version: "2.81.3"
      - name: Security advisors on disposable local stack
        run: |
          set -euo pipefail
          test ! -f supabase/.temp/project-ref
          supabase db advisors --help
          supabase db advisors --local --type security --level info --fail-on none
      - if: always()
        run: supabase stop --no-backup
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript no new diagnostics
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.app.json --pretty false > /tmp/romax-gmail-tsc.log 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then exit 0; fi
          cat /tmp/romax-gmail-tsc.log
          test "$(git hash-object src/pages/Index.tsx)" = "c1cac2b37bfb357c16d5f821cd9cbda067c5429b"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const diagnostics=readFileSync('/tmp/romax-gmail-tsc.log','utf8').split('\n').filter(x=>x.includes('error TS'));
          const expected=['src/pages/Index.tsx(42,24): error TS2322:','src/pages/Index.tsx(43,26): error TS2322:','src/pages/Index.tsx(59,26): error TS2322:'];
          assert.equal(diagnostics.length,expected.length);
          expected.forEach((prefix,i)=>assert.ok(diagnostics[i].startsWith(prefix),diagnostics[i]));
          JS
      - run: npx eslint src/components/provider/GmailConnectionPanel.tsx src/pages/GmailCallback.tsx src/components/provider/OpportunitiesView.tsx src/components/provider/RequestDetail.tsx src/components/provider/romaxRequestList.ts src/components/provider/RequestEnrichment.tsx src/components/provider/romaxEnrichment.ts
      - run: node --experimental-strip-types --test tests/romax-gmail-import-policy.test.ts tests/romax-r3-sol-1.test.ts tests/romax-r3-sol-2.test.ts
      - run: npm run build
