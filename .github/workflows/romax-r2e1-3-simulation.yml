name: "ROMAX R2-E1.3 reconciliation simulation"

on:
  pull_request:
    branches: ["productization/mvp"]
    paths:
      - "scripts/romax_r2e1_3_simulation.py"
      - "scripts/test_romax_r2e1_3_simulation.py"
      - ".github/workflows/romax-r2e1-3-simulation.yml"
      - "docs/ROMAX_R2E1_3_HOMOLOGATION_SIMULATION.md"
  push:
    branches: ["feature/romax-r2e1-3-homologation-simulation"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: romax-r2e1-3-simulation-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-simulation-tests:
    name: "ROMAX simulation tests (synthetic fixtures only)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Run synthetic tests
        run: python -m unittest discover -s scripts -p "test_romax_r2e1_3_simulation.py" -v
